<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — {{tagline}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{name}} — {{tagline}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
{{og_image}}
<meta name="twitter:card" content="summary_large_image">
{{favicon}}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="grain" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="ring" id="ring" aria-hidden="true"></div>
<div class="loupe" id="loupe" aria-hidden="true"></div>

<a class="skip" href="#gallery">Skip to photographs</a>

<header class="topbar">
  <a class="topbar__name" href="#top">{{name}}</a>
  <nav class="topbar__right">
    <a class="navlink" href="#gallery" id="nav-index">Index</a>
    <a class="navlink" href="#about">About</a>
    <a class="navlink" href="#contact">Contact</a>
    <button class="navlink" id="hud-toggle" type="button" aria-pressed="true">HUD</button>
  </nav>
</header>

<header class="hero" id="top">
  {{hero_img}}
  <div class="hero__scrim"></div>
  <div class="hero__type">
    <div>
      <div class="hero__clip"><h1 id="hero-title">{{name}}</h1></div>
      <p class="hero__sub">{{tagline}}</p>
    </div>
    <div class="hero__meta" id="meta"></div>
  </div>
  <span class="hero__cue" aria-hidden="true"></span>
</header>

<main>
  <section class="series-index" id="series" hidden aria-label="Series">
    <span class="label" id="series-label">Selected series</span>
    <div class="series-list" id="series-list"></div>
  </section>

  <div class="viewbar" id="viewbar" hidden>
    <div class="pills" role="group" aria-label="Gallery view">
      <button type="button" class="pill is-on" data-view="index">Index</button>
      <button type="button" class="pill" data-view="sheet">Contact Sheet</button>
      <button type="button" class="pill" data-view="story">Story Mode</button>
      <button type="button" class="pill" data-view="reel">Reel</button>
    </div>
    <div class="pills pills--filter" id="filters" role="group" aria-label="Show" hidden></div>
    <span class="viewbar__count" id="viewcount"></span>
  </div>

  <section class="gallery gallery--index" id="gallery" aria-label="Photographs"></section>

  <section class="empty" id="empty" hidden>
    <p class="empty__title">The roll is empty.</p>
    <p class="empty__body">
      Put image files in the <code>photos</code> folder, then commit and push.
      The gallery builds itself from whatever it finds.
    </p>
  </section>

  {{about}}

  <section class="contact" id="contact">
    <span class="label">Get in touch</span>
    <a class="contact__mail" id="contact-mail" href="mailto:{{email}}" data-magnetic>{{email}}</a>
    <div class="contact__links" id="contact-links"></div>
  </section>
</main>

<footer class="footer">
  <p id="footer-text"></p>
  <p id="footer-place"></p>
</footer>

<div class="hud" id="hud" hidden>
  <span class="hud__dot" aria-hidden="true"></span>
  <span id="hud-text">—</span>
</div>

<section class="story" id="story" hidden aria-label="Story mode"></section>
<div class="story__bar" id="story-bar" hidden aria-hidden="true"></div>
<button class="story__close" id="story-close" type="button" hidden>× Close</button>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
  <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close viewer">× Close</button>
  <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous photograph">←</button>
  <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next photograph">→</button>
  <figure class="lightbox__figure"><img id="lb-img" alt=""></figure>
  <figcaption class="lb-cap" id="lb-cap"></figcaption>
  <span class="lb-count" id="lb-count"></span>
</div>

<script src="app.js"></script>
</body>
</html>
