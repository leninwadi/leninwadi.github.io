<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — {{tagline}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{name}} — {{tagline}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
{{og_image}}
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23F5F6F4'/><rect x='3' y='4.5' width='10' height='7' fill='none' stroke='%231D4E89' stroke-width='1.4'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<a class="skip" href="#gallery">Skip to photographs</a>

<nav class="topbar" id="topbar">
  <a class="topbar__name" href="#top">{{name}}</a>
  <div class="topbar__right">
    <div class="toggle" id="controls" role="group" aria-label="Gallery view" hidden>
      <button type="button" class="toggle__btn is-on" data-view="plates">Plates</button>
      <button type="button" class="toggle__btn" data-view="sheet">Sheet</button>
    </div>
    <a class="topbar__link" href="#about">About</a>
    <a class="topbar__link" href="mailto:{{email}}">Contact</a>
  </div>
</nav>

<header class="hero" id="top">
  {{hero_img}}
  <div class="hero__scrim"></div>
  <div class="hero__type">
    <div class="hero__clip"><h1>{{name}}</h1></div>
    <div class="hero__strip">
      <span class="hero__tag">{{tagline}}</span>
      <span class="hero__rule" aria-hidden="true"></span>
      <span class="hero__meta" id="meta"></span>
    </div>
  </div>
  <a class="hero__cue" href="#gallery" aria-label="Scroll to photographs"><span></span></a>
</header>

<main>
  <section class="lead" id="lead" aria-label="Opening photograph"></section>
  <section class="gallery gallery--plates" id="gallery" aria-label="Photographs"></section>

  <section class="empty" id="empty" hidden>
    <div class="empty__sheet" aria-hidden="true">
      <span style="--r:3/2"></span><span style="--r:2/3"></span><span style="--r:1/1"></span>
      <span style="--r:3/2"></span><span style="--r:4/5"></span><span style="--r:3/2"></span>
    </div>
    <p class="empty__title">The roll is empty.</p>
    <p class="empty__body">
      Put image files in the <code>photos</code> folder, then commit and push.
      The gallery builds itself from whatever it finds.
    </p>
  </section>

  {{about}}
</main>

<footer class="footer">
  <p id="footer-text"></p>
  <p class="colophon">Built from the <code>photos</code> folder.</p>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
  <button class="lightbox__close" id="lb-close" aria-label="Close viewer">Close</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Previous photograph">←</button>
  <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Next photograph">→</button>
  <figure class="lightbox__figure">
    <div class="lightbox__stage"><img id="lb-img" alt=""></div>
    <figcaption class="label" id="lb-label"></figcaption>
  </figure>
  <div class="filmstrip" id="filmstrip" aria-label="All frames"></div>
</div>

<script src="app.js"></script>
</body>
</html>
